<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architecture Portfolio | 최원제</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Vercel Web Analytics 스크립트 (방문자 추적용) -->
    <script src="/_vercel/insights/script.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
        .story-ring { padding: 4px; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(8px); }
    </style>
</head>
<body class="bg-[#FAFAFA]" oncontextmenu="return false" onselectstart="return false" ondragstart="return false">

    <nav class="fixed w-full z-40 glass border-b border-gray-200">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <h1 class="text-lg font-semibold tracking-tight">Wonjae's Arch</h1>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto pt-24 px-4 pb-12">
        <header class="flex items-center space-x-8 mb-10">
            <div class="story-ring w-24 h-24 md:w-32 md:h-32 rounded-full cursor-pointer hover:scale-105 transition-transform shrink-0" onclick="openProfileModal()">
                <div class="w-full h-full rounded-full overflow-hidden bg-gray-200 p-1 flex items-center justify-center">
                    <!-- object-top 추가: 세로로 긴 사진일 경우 얼굴이 있는 위쪽을 기준으로 잘라서 보여줌 -->
                    <img src="images/profile.jpg" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1536895058696-a69b1c7ba34d?w=400';" class="w-full h-full object-cover object-top rounded-full bg-white">
                </div>
            </div>
            <div class="flex-1">
                <h2 class="text-2xl md:text-3xl font-light">choi_wonjae</h2>
                <p class="mt-2 text-sm md:text-md text-gray-500 font-medium">논리적인 공간 기획부터 디테일한 구현까지 | Junior Architectural Designer, B.Arch</p>
            </div>
        </header>

        <div class="grid grid-cols-3 gap-0.5 md:gap-4">
            <div class="aspect-square bg-gray-200 cursor-pointer overflow-hidden" onclick="openModal(0)">
                <img src="https://images.unsplash.com/photo-1513694203232-719a280e022f?w=600" class="w-full h-full object-cover hover:opacity-80 transition-opacity">
            </div>
            <div class="aspect-square bg-gray-200 cursor-pointer overflow-hidden" onclick="openModal(1)">
                <img src="https://images.unsplash.com/photo-1600607688969-a5bfcd646154?w=600" class="w-full h-full object-cover hover:opacity-80 transition-opacity">
            </div>
            <div class="aspect-square bg-gray-200 cursor-pointer overflow-hidden" onclick="openModal(2)">
                <img src="https://images.unsplash.com/photo-1497366216548-37526070297c?w=600" class="w-full h-full object-cover hover:opacity-80 transition-opacity">
            </div>
        </div>
    </main>

    <!-- Project Detail Modal -->
    <div id="project-modal" class="modal-overlay hidden p-4 md:p-6">
        <div class="bg-white w-[80vw] h-[80vh] rounded-2xl overflow-hidden shadow-2xl flex flex-col md:flex-row relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-3xl z-50 text-white bg-black/50 w-10 h-10 rounded-full hover:bg-black">&times;</button>
            <div class="flex-[9] md:flex-[4] bg-black relative overflow-hidden flex items-center">
                <div id="slider-container" class="flex transition-transform duration-500 ease-in-out h-full w-full"></div>
                <button onclick="moveSlide(-1)" class="absolute left-4 text-white text-2xl hover:text-gray-300 z-50">&#10094;</button>
                <button onclick="moveSlide(1)" class="absolute right-4 text-white text-2xl hover:text-gray-300 z-50">&#10095;</button>
            </div>
            <div class="flex-[1] p-6 md:p-8 bg-white border-t md:border-l border-gray-100 overflow-y-auto">
                <h3 id="modal-title" class="text-xl md:text-2xl font-bold mb-4">Project Title</h3>
                <p class="text-sm md:text-base text-gray-600 leading-relaxed">상세 설명이 들어가는 공간입니다.</p>
            </div>
        </div>
    </div>

    <!-- Profile Modal -->
    <div id="profile-modal" class="modal-overlay hidden p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
            <div class="p-6 flex flex-col items-center gap-4 border-b border-gray-100 relative">
                <button onclick="closeProfileModal()" class="absolute top-4 right-4 text-2xl text-gray-400">&times;</button>
                <div class="w-24 h-24 rounded-full overflow-hidden bg-gray-200 border-2 border-white shadow-md flex items-center justify-center">
                    <!-- object-top 추가 -->
                    <img src="images/profile.jpg" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1536895058696-a69b1c7ba34d?w=200';" class="w-full h-full object-cover object-top bg-white">
                </div>
                <span class="font-bold text-lg">choi_wonjae</span>
            </div>
            <div class="p-6 overflow-y-auto space-y-8">
                <div>
                    <h4 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4">WORK HISTORY</h4>
                    <div class="space-y-4 text-sm">
                        <p>• 2025 광운대학교 건축학과 졸업</p>
                        <p>• 2023 건축 설계 인턴십 과정 수료</p>
                        <p>• 2022 건축공모전 입상</p>
                    </div>
                </div>
                <div>
                    <button onclick="toggleSkills()" class="flex justify-between items-center w-full text-xs font-bold text-gray-400 uppercase tracking-widest hover:text-black">
                        SKILL SET <i id="skill-icon" class="fas fa-chevron-down"></i>
                    </button>
                    <div id="skill-list" class="hidden mt-4 space-y-5">
                        <div class="space-y-1"><div class="flex justify-between text-xs font-semibold"><span>AutoCAD</span><span>95%</span></div><div class="h-1.5 w-full bg-gray-100 rounded-full overflow-hidden"><div class="h-full bg-black w-[95%]"></div></div></div>
                        <div class="space-y-1"><div class="flex justify-between text-xs font-semibold"><span>Rhinoceros</span><span>85%</span></div><div class="h-1.5 w-full bg-gray-100 rounded-full overflow-hidden"><div class="h-full bg-gray-800 w-[85%]"></div></div></div>
                        <div class="space-y-1"><div class="flex justify-between text-xs font-semibold"><span>Revit</span><span>60%</span></div><div class="h-1.5 w-full bg-gray-100 rounded-full overflow-hidden"><div class="h-full bg-gray-600 w-[60%]"></div></div></div>
                        <div class="space-y-1"><div class="flex justify-between text-xs font-semibold"><span>Photoshop</span><span>70%</span></div><div class="h-1.5 w-full bg-gray-100 rounded-full overflow-hidden"><div class="h-full bg-gray-500 w-[70%]"></div></div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('keydown', function(e) {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0) || e.keyCode == 'C'.charCodeAt(0))) || (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0))) {
                alert("저작권 보호를 위해 개발자 도구 사용이 제한됩니다.");
                return false;
            }
        });

        const projects = [
            { title: "Graduation Project", imgs: ["https://images.unsplash.com/photo-1513694203232-719a280e022f?w=1200", "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=1200"] },
            { title: "Competition Work", imgs: ["https://images.unsplash.com/photo-1600607688969-a5bfcd646154?w=1200", "https://images.unsplash.com/photo-1582063289852-62e3a244f77c?w=1200"] },
            { title: "Studio Design", imgs: ["https://images.unsplash.com/photo-1497366216548-37526070297c?w=1200"] }
        ];

        let currentIdx = 0;
        let activeProject = null;

        function openModal(idx) {
            activeProject = projects[idx];
            currentIdx = 0;
            const container = document.getElementById('slider-container');
            container.innerHTML = activeProject.imgs.map(img => `<div class="min-w-full h-full flex items-center justify-center"><img src="${img}" class="max-w-full max-h-full object-contain"></div>`).join('');
            document.getElementById('modal-title').innerText = activeProject.title;
            updateSlider();
            document.getElementById('project-modal').classList.remove('hidden');
        }

        function moveSlide(dir) {
            currentIdx = (currentIdx + dir + activeProject.imgs.length) % activeProject.imgs.length;
            updateSlider();
        }

        function updateSlider() { document.getElementById('slider-container').style.transform = `translateX(-${currentIdx * 100}%)`; }
        function toggleSkills() { 
            document.getElementById('skill-list').classList.toggle('hidden');
            document.getElementById('skill-icon').classList.toggle('fa-chevron-down');
            document.getElementById('skill-icon').classList.toggle('fa-chevron-up');
        }
        function closeModal() { document.getElementById('project-modal').classList.add('hidden'); }
        function openProfileModal() { document.getElementById('profile-modal').classList.remove('hidden'); }
        function closeProfileModal() { document.getElementById('profile-modal').classList.add('hidden'); }
    </script>
</body>
</html>
